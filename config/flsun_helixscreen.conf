# FLSUN_HelixScreen - Moonraker settings
# install.sh copies this file to ~/printer_data/config/flsun_helixscreen.conf
# once and never overwrites it.

[update_manager flsun_helixscreen]
type: git_repo
primary_branch: main
path: ~/FLSUN_HelixScreen
origin: https://github.com/DIEHARDave/FLSUN_HelixScreen.git
# Restarting the service after an update installs the HelixScreen release
# the update pinned.
managed_services: flsun_helixscreen
