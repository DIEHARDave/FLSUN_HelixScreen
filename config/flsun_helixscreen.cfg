# FLSUN_HelixScreen settings. install.sh copies this file to
# ~/printer_data/config/flsun_helixscreen.cfg once; edit that copy and save.
# Saving applies the change.

[helixscreen]
# stable: HelixScreen's stable releases.
# beta:   beta releases too. New features arrive here first.
# Until a stable release supports the T1 Pro, stable follows beta.
# Switching from beta to stable never downgrades; you move to stable at the
# next stable release that is newer than what you have.
channel: stable
