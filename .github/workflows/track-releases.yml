name: Track HelixScreen releases

# Pins the newest upstream HelixScreen releases that include a FLSun T1
# package. Each change is a commit, which printers see as an update for
# FLSUN_HelixScreen in Mainsail's and Fluidd's update manager.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-releases

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for new releases
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          message=$(python3 tools/track_releases.py)
          echo "message=$message" >> "$GITHUB_OUTPUT"
      - name: Commit the new pins
        if: steps.check.outputs.message != ''
        env:
          MESSAGE: ${{ steps.check.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions
          git commit -m "$MESSAGE"
          git push
